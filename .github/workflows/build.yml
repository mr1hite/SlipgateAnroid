name: Build Slipgate Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compile native ByeDPI (libciadpi.so) for ARM64 & ARMv7
        run: |
          git clone https://github.com/hufrea/byedpi.git /tmp/byedpi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          # Находим актуальную папку NDK на раннере GitHub
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          NDK_TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "Using NDK Toolchain at: $NDK_TOOLCHAIN"

          # Сборка под arm64-v8a
          make -C /tmp/byedpi clean
          make -C /tmp/byedpi CC="$NDK_TOOLCHAIN/aarch64-linux-android24-clang" LDFLAGS="-s -pie"
          cp /tmp/byedpi/ciadpi app/src/main/jniLibs/arm64-v8a/libciadpi.so

          # Сборка под armeabi-v7a
          make -C /tmp/byedpi clean
          make -C /tmp/byedpi CC="$NDK_TOOLCHAIN/armv7a-linux-androideabi24-clang" LDFLAGS="-s -pie"
          cp /tmp/byedpi/ciadpi app/src/main/jniLibs/armeabi-v7a/libciadpi.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Slipgate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slipgate-Android-v1.8.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
