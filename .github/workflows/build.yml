name: Build Slipgate Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write Android SDK Licenses directly
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license"

      - name: Compile native ByeDPI
        run: |
          git clone https://github.com/hufrea/byedpi.git /tmp/byedpi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          NDK_TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          make -C /tmp/byedpi clean
          make -C /tmp/byedpi CC="$NDK_TOOLCHAIN/aarch64-linux-android24-clang" LDFLAGS="-s -pie"
          cp /tmp/byedpi/ciadpi app/src/main/jniLibs/arm64-v8a/libciadpi.so

          make -C /tmp/byedpi clean
          make -C /tmp/byedpi CC="$NDK_TOOLCHAIN/armv7a-linux-androideabi24-clang" LDFLAGS="-s -pie"
          cp /tmp/byedpi/ciadpi app/src/main/jniLibs/armeabi-v7a/libciadpi.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix settings.gradle and Build APK
        run: |
          # Ищем любой файл settings.gradle или settings.gradle.kts в репозитории
          FOUND_SETTINGS=$(find . -name "settings.gradle*" | head -n 1)

          if [ -n "$FOUND_SETTINGS" ]; then
            echo "Found settings file at: $FOUND_SETTINGS"
            # Если он лежал не в корне, копируем его в корень под именем settings.gradle.kts
            cp "$FOUND_SETTINGS" ./settings.gradle.kts
          else
            echo "Settings file not found at all, creating standard settings.gradle.kts in root"
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SlipgateAnroid"
          include(":app")
          EOF
          fi

          echo "Root directory contents:"
          ls -la

          # Запускаем сборку
          gradle :app:assembleDebug --no-daemon

      - name: Upload Slipgate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slipgate-Android-v1.8.0-debug
          path: app/build/outputs/apk/debug/*.apk
