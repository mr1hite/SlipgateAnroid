name: Build Slipgate Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write Android SDK Licenses directly
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license"

      - name: Clean broken files and recreate BootReceiver.kt
        run: |
          TARGET_DIR="app/src/main/java/com/slipgate/android"
          mkdir -p "$TARGET_DIR"

          # Принудительно удаляем любые поврежденные файлы с BootReceiver в названии
          find "$TARGET_DIR" -name "*BootReceiver*" -delete || true

          # Записываем чистый файл BootReceiver.kt
          cat << 'EOF' > "$TARGET_DIR/BootReceiver.kt"
          package com.slipgate.android

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val validActions = setOf(
                      Intent.ACTION_BOOT_COMPLETED,
                      "android.intent.action.QUICKBOOT_POWERON",
                      Intent.ACTION_MY_PACKAGE_REPLACED
                  )
                  if (intent.action in validActions) {
                      val prefs = context.getSharedPreferences("slipgate_prefs", Context.MODE_PRIVATE)
                      val autoStart = prefs.getBoolean("auto_start", false)

                      if (autoStart && VpnService.prepare(context) == null) {
                          val serviceIntent = Intent(context, SlipgateVpnService::class.java).apply {
                              action = SlipgateVpnService.ACTION_START
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(serviceIntent)
                          } else {
                              context.startService(serviceIntent)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile native ByeDPI
        run: |
          git clone https://github.com/hufrea/byedpi.git /tmp/byedpi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          NDK_TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          make -C /tmp/byedpi clean
          make -C /tmp/byedpi CC="$NDK_TOOLCHAIN/aarch64-linux-android24-clang" LDFLAGS="-s -pie"
          cp /tmp/byedpi/ciadpi app/src/main/jniLibs/arm64-v8a/libciadpi.so

          make -C /tmp/byedpi clean
          make -C /tmp/byedpi CC="$NDK_TOOLCHAIN/armv7a-linux-androideabi24-clang" LDFLAGS="-s -pie"
          cp /tmp/byedpi/ciadpi app/src/main/jniLibs/armeabi-v7a/libciadpi.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Slipgate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slipgate-Android-v1.8.0-debug
          path: app/build/outputs/apk/debug/*.apk
